services:
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - grafana-data:/var/lib/grafana
      - prometheus-data:/prometheus
    command: >
      sh -c "
        chown -R 472:472 /var/lib/grafana &&
        chown -R 65534:65534 /prometheus
      "

  prometheus:
    image: prom/prometheus
    container_name: autografana-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/generated/prometheus-web.yml:/etc/prometheus/web.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      permissions:
        condition: service_completed_successfully
      cadvisor-auth:
        condition: service_started
      container-name-exporter:
        condition: service_started
      node-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana
    container_name: autografana-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/generated/grafana-datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      permissions:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.55.1}
    container_name: autografana-cadvisor
    restart: unless-stopped
    privileged: true
    cgroup: host
    pid: host
    userns_mode: host
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    command:
      - -logtostderr
      - -docker=unix:///var/run/docker.sock
      - -containerd=/run/containerd/containerd.sock
      - -containerd-namespace=${CONTAINERD_NAMESPACE:-moby}
      - -store_container_labels=true
    volumes:
      - /:/rootfs:ro
      - ${DOCKER_RUN_DIR:-/var/run}:/var/run:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}:/var/lib/docker:ro
      - ${CONTAINERD_ROOT_DIR:-/var/lib/containerd}:/var/lib/containerd:ro
      - /dev/disk/:/dev/disk:ro

  cadvisor-auth:
    image: nginx:stable
    container_name: autografana-cadvisor-auth
    restart: unless-stopped
    volumes:
      - ./conf/nginx/cadvisor-auth.conf:/etc/nginx/nginx.conf:ro
      - ./monitoring/generated/cadvisor.htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    depends_on:
      - cadvisor

  container-name-exporter:
    build: ./exporters/container-name-exporter
    container_name: autografana-container-name-exporter
    restart: unless-stopped
    environment:
      - DOCKER_SOCKET=/var/run/docker.sock
      - LISTEN_PORT=9101
      - DOCKER_TIMEOUT_SECONDS=3
      - REFRESH_INTERVAL_SECONDS=5
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock

  node-exporter:
    image: prom/node-exporter
    container_name: autografana-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

volumes:
  grafana-data:
  prometheus-data:
